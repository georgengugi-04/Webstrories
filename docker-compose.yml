name: greentrack

services:
  db:
    image: mysql:8.4
    container_name: greentrack-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-greentrack}
      MYSQL_USER: ${MYSQL_USER:-greentrack}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - greentrack-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    # No ports published to the host by default — only the backend container
    # (on the same Docker network) needs to reach MySQL. Uncomment for local
    # debugging with a DB GUI:
    # ports:
    #   - "3306:3306"

  backend:
    image: ${DOCKERHUB_USERNAME:-yourusername}/greentrack-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greentrack-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER:-greentrack}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-greentrack}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_TO_NUMBER: ${WHATSAPP_TO_NUMBER}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      NOTION_TOKEN: ${NOTION_TOKEN}
      NOTION_DATABASE_ID: ${NOTION_DATABASE_ID}
      NOTION_TITLE_PROPERTY: ${NOTION_TITLE_PROPERTY:-Name}
    networks:
      - greentrack-net
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: ${DOCKERHUB_USERNAME:-yourusername}/greentrack-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: greentrack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:4000}
      WHATSAPP_NUMBER: ${WHATSAPP_TO_NUMBER:-2547XXXXXXXX}
    networks:
      - greentrack-net
    ports:
      - "${FRONTEND_PORT:-8080}:80"

networks:
  greentrack-net:
    driver: bridge

volumes:
  db-data:
    driver: local
